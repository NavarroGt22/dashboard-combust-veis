<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">Evolução mensal da gasolina comum</title>
  <desc id="desc">Séries de julho a outubro por ano disponível.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071321"/>
      <stop offset="100%" stop-color="#0d2133"/>
    </linearGradient>
  </defs>
  <rect width="920" height="440" rx="16" fill="url(#bg2)"/>
  <text x="36" y="42" fill="#e8f2fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Evolução mensal · gasolina comum</text>
  <text x="36" y="68" fill="#8aa3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Julho a outubro por ano · R$/L nominal</text>

  <g stroke="#193346" stroke-width="1">
    <line x1="90" y1="100" x2="700" y2="100"/>
    <line x1="90" y1="160" x2="700" y2="160"/>
    <line x1="90" y1="220" x2="700" y2="220"/>
    <line x1="90" y1="280" x2="700" y2="280"/>
    <line x1="90" y1="340" x2="700" y2="340"/>
  </g>
  <g fill="#6f879c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">
    <text x="82" y="104">R$ 7,00</text>
    <text x="82" y="164">R$ 6,00</text>
    <text x="82" y="224">R$ 5,00</text>
    <text x="82" y="284">R$ 4,00</text>
    <text x="82" y="344">R$ 3,00</text>
  </g>
  <g fill="#b7c9d8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="150" y="368">Jul</text>
    <text x="330" y="368">Ago</text>
    <text x="510" y="368">Set</text>
    <text x="690" y="368">Out</text>
  </g>

  <!-- y = 340 - (price-3)*60 ; x: jul=150, ago=330, set=510, out=690 -->
  <!-- 2017: 3.607, 3.815, 3.900, 3.923 -->
  <polyline fill="none" stroke="#38d5c8" stroke-width="2.8" points="150,303.6 330,291.1 510,286.0 690,284.6"/>
  <g fill="#38d5c8">
    <circle cx="150" cy="303.6" r="4.5"/><circle cx="330" cy="291.1" r="4.5"/><circle cx="510" cy="286.0" r="4.5"/><circle cx="690" cy="284.6" r="4.5"/>
  </g>

  <!-- 2018: 4.536, 4.489, 4.655, 4.754 -->
  <polyline fill="none" stroke="#48b9ee" stroke-width="2.8" points="150,247.8 330,250.7 510,240.7 690,234.8"/>
  <g fill="#48b9ee">
    <circle cx="150" cy="247.8" r="4.5"/><circle cx="330" cy="250.7" r="4.5"/><circle cx="510" cy="240.7" r="4.5"/><circle cx="690" cy="234.8" r="4.5"/>
  </g>

  <!-- 2019: 4.394, 4.363, 4.370, 4.418 -->
  <polyline fill="none" stroke="#727ef8" stroke-width="2.8" points="150,256.4 330,258.2 510,257.8 690,254.9"/>
  <g fill="#727ef8">
    <circle cx="150" cy="256.4" r="4.5"/><circle cx="330" cy="258.2" r="4.5"/><circle cx="510" cy="257.8" r="4.5"/><circle cx="690" cy="254.9" r="4.5"/>
  </g>

  <!-- 2021: 5.800, 5.921, 6.084, 6.337 -->
  <polyline fill="none" stroke="#ffad66" stroke-width="2.8" points="150,172.0 330,164.7 510,155.0 690,139.8"/>
  <g fill="#ffad66">
    <circle cx="150" cy="172.0" r="4.5"/><circle cx="330" cy="164.7" r="4.5"/><circle cx="510" cy="155.0" r="4.5"/><circle cx="690" cy="139.8" r="4.5"/>
  </g>

  <!-- 2022: 6.059, 5.424, 5.034, 4.864 -->
  <polyline fill="none" stroke="#e576aa" stroke-width="3.2" points="150,156.5 330,194.6 510,218.0 690,228.2"/>
  <g fill="#e576aa">
    <circle cx="150" cy="156.5" r="5"/><circle cx="330" cy="194.6" r="5"/><circle cx="510" cy="218.0" r="5"/><circle cx="690" cy="228.2" r="5"/>
  </g>

  <!-- 2023: 5.609, 5.713, 5.840, 5.765 -->
  <polyline fill="none" stroke="#84d095" stroke-width="2.8" points="150,183.5 330,177.2 510,169.6 690,174.1"/>
  <g fill="#84d095">
    <circle cx="150" cy="183.5" r="4.5"/><circle cx="330" cy="177.2" r="4.5"/><circle cx="510" cy="169.6" r="4.5"/><circle cx="690" cy="174.1" r="4.5"/>
  </g>

  <!-- legend -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
    <rect x="730" y="110" width="14" height="14" rx="3" fill="#38d5c8"/><text x="754" y="122" fill="#d5e4ef">2017</text>
    <rect x="730" y="140" width="14" height="14" rx="3" fill="#48b9ee"/><text x="754" y="152" fill="#d5e4ef">2018</text>
    <rect x="730" y="170" width="14" height="14" rx="3" fill="#727ef8"/><text x="754" y="182" fill="#d5e4ef">2019</text>
    <rect x="730" y="200" width="14" height="14" rx="3" fill="#ffad66"/><text x="754" y="212" fill="#d5e4ef">2021</text>
    <rect x="730" y="230" width="14" height="14" rx="3" fill="#e576aa"/><text x="754" y="242" fill="#d5e4ef">2022</text>
    <rect x="730" y="260" width="14" height="14" rx="3" fill="#84d095"/><text x="754" y="272" fill="#d5e4ef">2023</text>
  </g>

  <text x="36" y="408" fill="#6f879c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Destaque: em 2022 a média cai de julho a outubro. A composição da amostra (postos/municípios) também muda entre os meses.</text>
</svg>
