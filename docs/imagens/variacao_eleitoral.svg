<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Variação julhooutubro em anos eleitorais</title>
  <desc id="desc">Comparação de preços da gasolina comum em 2018 e 2022.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071321"/>
      <stop offset="100%" stop-color="#0d2133"/>
    </linearGradient>
  </defs>
  <rect width="920" height="420" rx="16" fill="url(#bg3)"/>
  <text x="36" y="42" fill="#e8f2fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Anos eleitorais · julho vs outubro</text>
  <text x="36" y="68" fill="#8aa3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Gasolina comum · R$/L · variação descritiva (não causal)</text>

  <g stroke="#193346" stroke-width="1">
    <line x1="80" y1="110" x2="880" y2="110"/>
    <line x1="80" y1="175" x2="880" y2="175"/>
    <line x1="80" y1="240" x2="880" y2="240"/>
    <line x1="80" y1="305" x2="880" y2="305"/>
    <line x1="80" y1="370" x2="880" y2="370"/>
  </g>
  <g fill="#6f879c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">
    <text x="72" y="114">R$ 7,00</text>
    <text x="72" y="179">R$ 5,25</text>
    <text x="72" y="244">R$ 3,50</text>
    <text x="72" y="309">R$ 1,75</text>
    <text x="72" y="374">R$ 0,00</text>
  </g>

  <!-- scale: y = 370 - price/7*260 -->
  <!-- 2018 jul 4.536 -> 201.5 ; out 4.754 -> 193.4 -->
  <rect x="220" y="201.5" width="70" height="168.5" rx="8" fill="#48b9ee"/>
  <rect x="300" y="193.4" width="70" height="176.6" rx="8" fill="#38d5c8"/>
  <text x="255" y="191" text-anchor="middle" fill="#e8f2fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">4,54</text>
  <text x="335" y="183" text-anchor="middle" fill="#e8f2fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">4,75</text>
  <text x="295" y="396" text-anchor="middle" fill="#b7c9d8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">2018</text>
  <text x="295" y="100" text-anchor="middle" fill="#ffad66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">+4,8%</text>

  <!-- 2022 jul 6.059 -> 144.9 ; out 4.864 -> 189.3 -->
  <rect x="560" y="144.9" width="70" height="225.1" rx="8" fill="#48b9ee"/>
  <rect x="640" y="189.3" width="70" height="180.7" rx="8" fill="#38d5c8"/>
  <text x="595" y="135" text-anchor="middle" fill="#e8f2fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">6,06</text>
  <text x="675" y="179" text-anchor="middle" fill="#e8f2fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">4,86</text>
  <text x="635" y="396" text-anchor="middle" fill="#b7c9d8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">2022</text>
  <text x="635" y="100" text-anchor="middle" fill="#e576aa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">19,7%</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
    <rect x="780" y="140" width="14" height="14" rx="3" fill="#48b9ee"/><text x="804" y="152" fill="#d5e4ef">Julho</text>
    <rect x="780" y="168" width="14" height="14" rx="3" fill="#38d5c8"/><text x="804" y="180" fill="#d5e4ef">Outubro</text>
  </g>
</svg>
